version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mqplus-postgres
    environment:
      POSTGRES_USER: mqplus
      POSTGRES_PASSWORD: mqplus_secret_password
      POSTGRES_DB: mqplus_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mqplus -d mqplus_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mqplus-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: mqplus-meilisearch
    environment:
      MEILI_MASTER_KEY: mqplus_meili_master_key
    ports:
      - '7700:7700'
    volumes:
      - meili_data:/meili_data

volumes:
  postgres_data:
  redis_data:
  meili_data:
